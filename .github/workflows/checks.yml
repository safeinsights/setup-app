name: Checks
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: read

jobs:
    all:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: lts/*
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Lint
              run: pnpm run lint
            - name: Run Trivy vulnerability scanner in fs mode
              uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
              with:
                  scan-type: 'fs'
                  scan-ref: '.'
                  trivy-config: trivy.yaml
            - name: Run Trivy license scanner
              uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
              with:
                  scan-type: 'fs'
                  scan-ref: '.'
                  scanners: 'license'
                  severity: 'HIGH,CRITICAL'
                  exit-code: '1'
            - name: Typecheck
              run: pnpm run typecheck
            - name: Tests
              run: pnpm run test

    # SAST with Semgrep CE from ci-workflows; findings at ERROR fail the job. It needs no secret,
    # so it also runs on fork PRs. `pull-requests: write` is only for the report comment.
    semgrep:
        permissions:
            contents: read
            pull-requests: write
        uses: safeinsights/ci-workflows/.github/workflows/semgrep.yaml@1e3e7f0a9fd39fa71bccf5aaa7c802464071bc9c # v4.1.0
